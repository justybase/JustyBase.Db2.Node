name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Build and offline tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24.13.1]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify OpenSSL for TLS tests
        run: openssl version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check API surface
        run: node tools/api/generate-ts-surface.cjs --check

      - name: Type-check tooling and the tests that are already clean
        run: npm run typecheck

      - name: Offline unit and protocol tests (with coverage report)
        run: >-
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination="${{ runner.temp }}/offline.junit.xml"
          tests/*.test.js

      - name: Reject unexpected skipped tests
        run: >-
          node tools/ci/check-junit-no-skips.cjs "${{ runner.temp }}/offline.junit.xml"
          --allow-skip 'DB2_SECMEC9_TEST_DSN is not set'

      - name: Upload offline junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-junit
          path: ${{ runner.temp }}/offline.junit.xml
          if-no-files-found: warn

      - name: ESM entry smoke test
        run: npm run test:esm

      - name: Generate SBOM (offline)
        run: node tools/sbom/generate-ts-sbom.cjs

      - name: Check npm package allowlist
        run: node tools/sbom/check-package-contents.cjs

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check API surface
        run: node tools/api/generate-ts-surface.cjs --check

      - name: Cross-platform API/config smoke tests
        run: node --test tests/api-surface.test.js tests/config.test.js

      - name: CommonJS entry smoke test
        run: node -e "const db2=require('./dist/cjs/index.js'); if(typeof db2.Db2Connection!=='function'||typeof db2.Db2Pool!=='function'||('CodePoint' in db2)) process.exit(1);"

      - name: ESM entry smoke test
        run: npm run test:esm

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - offline
      - platform-smoke
      - parity-ibmdb
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI lanes
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
          PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
          PARITY_RESULT: ${{ needs.parity-ibmdb.result }}
        run: |
          test "$OFFLINE_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
          test "$PARITY_RESULT" = "success"
          echo "All required CI lanes passed"

  parity-ibmdb:
    name: ibm_db SELECT/type parity (Node 22, fresh Db2 12.1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Test-only oracle: node-ibm_db (+ IBM clidriver download) is installed
      # with --no-save inside test-db2-integration.sh --parity, so it never
      # enters package.json, the lockfile, SBOM or the published tarball.
      # The driver under test still has no IBM runtime dependency.
      - name: Run differential parity against pinned node-ibm_db
        env:
          DB2_IT_REPORT_DIR: ${{ runner.temp }}/db2-it-reports
        run: ./scripts/test-db2-integration.sh --parity

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-report
          path: parity-report.json
          if-no-files-found: warn

      - name: Upload Db2 junit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db2-parity-junit
          path: ${{ runner.temp }}/db2-it-reports/
          if-no-files-found: warn
