name: Live Db2 Qualification (Node.js)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Full fresh Db2 integration qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run full live Db2 integration qualification
        run: ./scripts/test-db2-integration.sh --full
