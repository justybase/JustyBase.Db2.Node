name: Live Db2 Qualification (Node.js)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Full fresh Db2 integration qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run full live Db2 integration qualification
        env:
          DB2_IT_REPORT_DIR: ${{ runner.temp }}/db2-it-reports
        run: ./scripts/test-db2-integration.sh --full

      - name: Upload full qualification junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db2-full-junit
          path: ${{ runner.temp }}/db2-it-reports/
          if-no-files-found: warn

  soak:
    name: TypeScript resource soak (15 minutes measured)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run resource soak against a fresh Db2 container
        env:
          DB2_IT_SOAK_SECONDS: "900"
          DB2_IT_REPORT_DIR: ${{ runner.temp }}/db2-soak-reports
        run: ./scripts/test-db2-integration.sh --soak

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db2-soak-log
          path: ${{ runner.temp }}/db2-soak-reports/
          if-no-files-found: warn
